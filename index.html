<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SITRO DROP - CS2 Wheel Upgrader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0b0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 90px;
    }

    .glow-bg {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 115, 0, 0.25) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
      filter: blur(25px);
    }

    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-badge {
      background: rgba(18, 18, 22, 0.9);
      border: 1px solid rgba(255, 119, 0, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      color: #ff8800;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.2);
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 120, 0, 0.6);
      text-transform: uppercase;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .logo span {
      color: #ff7700;
    }

    .app-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
      padding: 0 15px;
    }

    .wheel-wrapper {
      position: relative;
      width: 290px;
      height: 290px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ff7700;
      z-index: 20;
      filter: drop-shadow(0 0 8px rgba(255, 119, 0, 0.9));
    }

    canvas#wheelCanvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 110, 0, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
      border: 3px solid rgba(255, 120, 0, 0.5);
    }

    .btn-reroll {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 119, 0, 0.4);
      color: #ffaa33;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }

    .btn-reroll:active {
      transform: scale(0.95);
      background: rgba(255, 119, 0, 0.2);
    }

    .selected-slot-card {
      width: 100%;
      max-width: 320px;
      background: rgba(18, 18, 22, 0.9);
      border: 1px solid rgba(255, 119, 0, 0.4);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .slot-details .title {
      font-size: 11px;
      color: #888888;
      text-transform: uppercase;
      font-weight: 700;
    }

    .slot-details .name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    .slot-price {
      font-size: 18px;
      font-weight: 800;
      color: #ff8800;
    }

    .btn-spin {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      background: linear-gradient(135deg, #ff8800 0%, #e64a00 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(230, 74, 0, 0.45);
      transition: all 0.2s ease;
    }

    .btn-spin:active {
      transform: scale(0.97);
    }

    .btn-spin:disabled {
      background: #2a2a30;
      color: #666666;
      box-shadow: none;
      cursor: not-allowed;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(14, 14, 18, 0.95);
      border-top: 1px solid rgba(255, 120, 0, 0.3);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
      backdrop-filter: blur(10px);
    }

    .btn-inventory {
      background: linear-gradient(135deg, #252530 0%, #1a1a22 100%);
      border: 1px solid rgba(255, 120, 0, 0.5);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 120, 0, 0.2);
    }

    .btn-steam-link {
      background: linear-gradient(135deg, #171a21 0%, #2a475e 100%);
      border: 1px solid #66c0f4;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(102, 192, 244, 0.2);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .inventory-sheet {
      position: fixed;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: 80vh;
      background: #121216;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      border-top: 2px solid #ff7700;
      z-index: 101;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: bottom 0.35s ease;
    }

    .modal-overlay.active .inventory-sheet {
      bottom: 0;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .btn-close {
      background: none;
      border: none;
      color: #888888;
      font-size: 26px;
      cursor: pointer;
    }

    /* NAV TABS INSIDE INVENTORY MODAL */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #888888;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #ff7700;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.4);
    }

    .tab-content {
      display: none;
      width: 100%;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      overflow-y: auto;
      flex-grow: 1;
      padding-bottom: 10px;
    }

    .item-card {
      background: rgba(22, 22, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
    }

    .item-card.selected {
      border-color: #ff7700;
      box-shadow: 0 0 12px rgba(255, 119, 0, 0.4);
    }

    .item-card .rarity-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .item-card .name {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .item-card .price {
      font-size: 14px;
      font-weight: 800;
      color: #ff8800;
      margin-bottom: 8px;
    }

    .btn-action-card {
      background: linear-gradient(135deg, #ff8800 0%, #e64a00 100%);
      border: none;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .deposit-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .deposit-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 119, 0, 0.4);
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: 0.2s;
    }

    .deposit-btn:hover {
      background: rgba(255, 119, 0, 0.2);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #18181c;
      border: 1px solid #ff7700;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 14px;
      box-shadow: 0 0 6px rgba(255, 119, 0, 0.3);
    }

    .result-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background: #1a1a22;
      border: 2px solid #ff7700;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      z-index: 200;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      text-align: center;
    }

    .result-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .rarity-consumer { background-color: #b0c3d9; }
    .rarity-restricted { background-color: #8847ff; }
    .rarity-classified { background-color: #d32ce6; }
    .rarity-covert { background-color: #eb4b4b; }
    .rarity-gold { background-color: #ffd700; }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <header>
    <div class="balance-badge" onclick="toggleModal('depositModal', true)">$ <span id="userBalance">100</span></div>
    <div class="logo">SITRO <span>DROP</span></div>
  </header>

  <div class="app-container">
    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas" width="560" height="560"></canvas>
    </div>

    <button class="btn-reroll" onclick="rerollWheelSkins()">Change Wheel Skins</button>

    <div class="selected-slot-card">
      <div class="slot-details">
        <div class="title">Staked Skin</div>
        <div class="name" id="slotName">Select Skin</div>
      </div>
      <div class="slot-price" id="slotPrice">$0</div>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spinWheel()">SPIN WHEEL</button>
  </div>

  <div class="bottom-bar">
    <button class="btn-inventory" onclick="toggleModal('inventoryModal', true)">
      INVENTORY (<span id="invCount">0</span>)
    </button>
    <a href="https://store.steampowered.com/tags/da/Inventarstyring/?l=russian&snr=1_5_9__409" target="_blank" class="btn-steam-link">
      Add from Steam
    </a>
  </div>

  <!-- Inventory Sheet Modal -->
  <div class="modal-overlay" id="inventoryModal" onclick="toggleModal('inventoryModal', false)">
    <div class="inventory-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title">Storage & Market</div>
        <button class="btn-close" onclick="toggleModal('inventoryModal', false)">&times;</button>
      </div>

      <!-- TABS ARE ONLY HERE INSIDE THE MODAL -->
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('skins')">Skins</button>
        <button class="tab-btn" onclick="switchTab('shop')">Shop</button>
        <button class="tab-btn" onclick="switchTab('sale')">Sale</button>
      </div>

      <!-- SKINS TAB -->
      <div class="tab-content active" id="tab-skins">
        <div class="inventory-grid" id="inventoryGrid"></div>
      </div>

      <!-- SHOP TAB -->
      <div class="tab-content" id="tab-shop">
        <div class="inventory-grid" id="shopGrid"></div>
      </div>

      <!-- SALE TAB -->
      <div class="tab-content" id="tab-sale">
        <div class="inventory-grid" id="saleGrid"></div>
      </div>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="depositModal" onclick="toggleModal('depositModal', false)">
    <div class="inventory-sheet" onclick="event.stopPropagation()" style="height: auto; max-height: 50vh;">
      <div class="sheet-header">
        <div class="sheet-title">Top Up Balance</div>
        <button class="btn-close" onclick="toggleModal('depositModal', false)">&times;</button>
      </div>
      <div class="deposit-options">
        <a href="https://www.visa.com" target="_blank" class="deposit-btn">
          <span class="card-badge">💳</span> Visa
        </a>
        <a href="https://www.mastercard.com" target="_blank" class="deposit-btn">
          <span class="card-badge">💳</span> Mastercard
        </a>
        <a href="https://example.com" target="_blank" class="deposit-btn">
          More
        </a>
      </div>
    </div>
  </div>

  <div class="result-toast" id="resultToast">RESULTS</div>

  <script>
    const SKIN_POOL = [
      { id: 1, name: 'P250 | Sand Dune', price: 2, rarity: 'rarity-consumer' },
      { id: 2, name: 'AK-47 | Safari Mesh', price: 10, rarity: 'rarity-consumer' },
      { id: 3, name: 'M4A4 | Evil Daimyo', price: 25, rarity: 'rarity-restricted' },
      { id: 4, name: 'AWP | Acheron', price: 50, rarity: 'rarity-restricted' },
      { id: 5, name: 'AK-47 | Redline', price: 100, rarity: 'rarity-classified' },
      { id: 6, name: 'AWP | Asiimov', price: 200, rarity: 'rarity-covert' },
      { id: 7, name: 'AK-47 | Vulcan', price: 400, rarity: 'rarity-covert' },
      { id: 8, name: 'M4A1-S | Printstream', price: 500, rarity: 'rarity-covert' },
      { id: 9, name: 'Karambit | Doppler', price: 800, rarity: 'rarity-gold' }
    ];

    let userBalance = 100;
    let userInventory = [
      { ...SKIN_POOL[0], instanceId: 101 }
    ];

    let selectedSkin = userInventory[0];
    let isSpinning = false;
    let currentWheelSkins = [];
    let currentRotation = 0;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
      updateBalanceUI();
      updateActiveSlotUI();
      renderInventory();
      renderShop();
      renderSale();
      generateWheelForSkin(selectedSkin);
    }

    function updateBalanceUI() {
      document.getElementById('userBalance').innerText = userBalance;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'skins') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-skins').classList.add('active');
      } else if (tabName === 'shop') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-shop').classList.add('active');
        renderShop();
      } else if (tabName === 'sale') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-sale').classList.add('active');
        renderSale();
      }
    }

    function generateWheelForSkin(skin) {
      if (!skin) return;

      const p = skin.price;

      let win1 = SKIN_POOL.find(s => s.price > p && s.price <= p * 1.5) || SKIN_POOL.find(s => s.price > p) || skin;
      let win2 = SKIN_POOL.find(s => s.price > p * 1.5 && s.price < p * 2) || SKIN_POOL.find(s => s.price > p) || win1;
      let win3 = SKIN_POOL.find(s => s.price >= p * 2) || SKIN_POOL[SKIN_POOL.length - 1];

      const lossSector = { id: 0, name: 'SKIN LOST', price: 0, isLoss: true };

      currentWheelSkins = [
        lossSector,
        win1,
        lossSector,
        win2,
        lossSector,
        win3
      ];

      drawWheel(0);
    }

    function rerollWheelSkins() {
      if (isSpinning || !selectedSkin) return;
      generateWheelForSkin(selectedSkin);
      showToast('Wheel Skins Changed');
    }

    function drawWheel(rotationAngle) {
      const numSlices = 6;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(rotationAngle);

      for (let i = 0; i < numSlices; i++) {
        const angle = i * sliceAngle;
        const item = currentWheelSkins[i];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 10, angle, angle + sliceAngle);
        ctx.closePath();
        
        ctx.fillStyle = item.isLoss ? '#1c0d0d' : '#112217';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#0b0b0d';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, radius - 5, angle, angle + sliceAngle);
        ctx.lineWidth = 6;
        ctx.strokeStyle = item.isLoss ? '#ff3333' : '#00ff66';
        ctx.stroke();

        ctx.save();
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = 'right';

        if (item.isLoss) {
          ctx.fillStyle = '#ff4444';
          ctx.font = 'bold 20px Segoe UI';
          ctx.fillText(item.name, radius - 35, 7);
        } else {
          ctx.fillStyle = '#00ff66';
          ctx.font = 'bold 16px Segoe UI';
          const displayName = item.name.length > 13 ? item.name.substring(0, 13) + '..' : item.name;
          ctx.fillText(displayName, radius - 35, 7);
        }

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, 2 * Math.PI);
      ctx.fillStyle = '#121216';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ff7700';
      ctx.stroke();

      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || !selectedSkin) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const stakedSkinRef = selectedSkin;

      const numSlices = 6;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const winningIndex = Math.floor(Math.random() * numSlices);
      const outcome = currentWheelSkins[winningIndex];

      const targetSliceCenter = (winningIndex * sliceAngle) + (sliceAngle / 2);
      const randomRounds = 5 + Math.floor(Math.random() * 3);
      const targetRotation = (randomRounds * 2 * Math.PI) + ((3 * Math.PI / 2) - targetSliceCenter);

      const startTime = performance.now();
      const spinDuration = 4000;

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = currentRotation + (targetRotation - currentRotation) * easeOut;

        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          currentRotation = targetRotation % (2 * Math.PI);
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;

          const stakedIndex = userInventory.findIndex(i => i.instanceId === stakedSkinRef.instanceId);
          if (stakedIndex !== -1) {
            userInventory.splice(stakedIndex, 1);
          }

          if (outcome.isLoss) {
            showToast('YOU LOST YOUR ' + stakedSkinRef.name + '!');
          } else {
            userInventory.unshift({ ...outcome, instanceId: Date.now() });
            showToast('WON: ' + outcome.name + '!');
          }

          selectedSkin = userInventory.length > 0 ? userInventory[0] : null;

          updateActiveSlotUI();
          renderInventory();
          renderSale();
          generateWheelForSkin(selectedSkin);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function updateActiveSlotUI() {
      if (!selectedSkin) {
        document.getElementById('slotName').innerText = 'No Skin Selected';
        document.getElementById('slotPrice').innerText = '$0';
        document.getElementById('spinBtn').disabled = true;
        return;
      }
      document.getElementById('slotName').innerText = selectedSkin.name;
      document.getElementById('slotPrice').innerText = '$' + selectedSkin.price;
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('invCount').innerText = userInventory.length;
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      grid.innerHTML = '';

      if (userInventory.length === 0) {
        grid.innerHTML = '<div style="color:#888; font-size:13px; grid-column:span 2; text-align:center; padding:20px;">Inventory is empty</div>';
        return;
      }

      userInventory.forEach((skin) => {
        const card = document.createElement('div');
        card.className = 'item-card ' + (selectedSkin && selectedSkin.instanceId === skin.instanceId ? 'selected' : '');
        card.onclick = () => selectSkinFromInventory(skin);

        card.innerHTML = `
          <div class="rarity-bar ${skin.rarity}"></div>
          <div class="name">${skin.name}</div>
          <div class="price">$${skin.price}</div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('invCount').innerText = userInventory.length;
    }

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';

      SKIN_POOL.forEach((skin) => {
        const card = document.createElement('div');
        card.className = 'item-card';

        card.innerHTML = `
          <div class="rarity-bar ${skin.rarity}"></div>
          <div class="name">${skin.name}</div>
          <div class="price">$${skin.price}</div>
          <button class="btn-action-card" onclick="buySkin(event, ${skin.id})">Buy</button>
        `;
        grid.appendChild(card);
      });
    }

    function buySkin(event, skinId) {
      event.stopPropagation();
      const skinToBuy = SKIN_POOL.find(s => s.id === skinId);
      if (!skinToBuy) return;

      if (userBalance >= skinToBuy.price) {
        userBalance -= skinToBuy.price;
        updateBalanceUI();
        userInventory.push({ ...skinToBuy, instanceId: Date.now() });
        renderInventory();
        renderSale();
        showToast('Bought ' + skinToBuy.name + '!');
      } else {
        showToast('Not enough balance!');
      }
    }

    function renderSale() {
      const grid = document.getElementById('saleGrid');
      grid.innerHTML = '';

      if (userInventory.length === 0) {
        grid.innerHTML = '<div style="color:#888; font-size:13px; grid-column:span 2; text-align:center; padding:20px;">No skins to sell</div>';
        return;
      }

      userInventory.forEach((skin) => {
        const card = document.createElement('div');
        card.className = 'item-card';

        card.innerHTML = `
          <div class="rarity-bar ${skin.rarity}"></div>
          <div class="name">${skin.name}</div>
          <div class="price">$${skin.price}</div>
          <button class="btn-action-card" onclick="sellSkin(event, ${skin.instanceId})">Sell ($${skin.price})</button>
        `;
        grid.appendChild(card);
      });
    }

    function sellSkin(event, instanceId) {
      event.stopPropagation();
      const index = userInventory.findIndex(i => i.instanceId === instanceId);
      if (index === -1) return;

      const soldSkin = userInventory[index];
      userBalance += soldSkin.price;
      updateBalanceUI();
      userInventory.splice(index, 1);

      if (selectedSkin && selectedSkin.instanceId === instanceId) {
        selectedSkin = userInventory.length > 0 ? userInventory[0] : null;
        updateActiveSlotUI();
        generateWheelForSkin(selectedSkin);
      }

      renderInventory();
      renderSale();
      showToast('Sold ' + soldSkin.name + ' for $' + soldSkin.price + '!');
    }

    function selectSkinFromInventory(skin) {
      if (isSpinning) return;
      selectedSkin = skin;
      updateActiveSlotUI();
      renderInventory();
      generateWheelForSkin(selectedSkin);
      toggleModal('inventoryModal', false);
    }

    function toggleModal(modalId, show) {
      const overlay = document.getElementById(modalId);
      if (show) overlay.classList.add('active');
      else overlay.classList.remove('active');
    }

    function showToast(text) {
      const toast = document.getElementById('resultToast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    init();
  </script>
</body>
    </html>
