<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Mini App</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-orange: #ff5500;
      --border-color: #30363d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      /* Фон у стилі ситро дроп (чорний з оранжевими крапками) */
      background-image: radial-gradient(var(--accent-orange) 15%, transparent 16%);
      background-size: 24px 24px;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* Верхня панель у стилі GitHub */
    .header {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 20px;
      background-color: rgba(22, 27, 34, 0.95);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .balance-display {
      font-size: 1.2rem;
      font-weight: bold;
      color: #3fb950;
    }

    .profile-container {
      position: relative;
    }

    .profile-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #30363d;
      border: 2px solid var(--border-color);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Випадаюче меню GitHub */
    .github-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      width: 240px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 101;
      overflow: hidden;
    }

    .github-dropdown.active {
      display: block;
    }

    .dropdown-header {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .dropdown-header span {
      display: block;
      font-weight: bold;
      color: #f0f6fc;
    }

    .dropdown-item {
      padding: 10px 12px;
      font-size: 0.9rem;
      color: var(--text-color);
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background-color: #1f242c;
    }

    /* Модальні вікна (Налаштування та Політика) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      max-width: 320px;
      width: 85%;
    }

    .modal-content h3 {
      margin-top: 0;
    }

    .close-btn {
      margin-top: 15px;
      background: var(--accent-orange);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    /* Основний контейнер гри */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
      box-sizing: border-box;
    }

    /* Зона клікера */
    .click-area {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 0%, #111 100%);
      border: 4px solid var(--accent-orange);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 85, 0, 0.4);
      transition: transform 0.05s ease;
      margin: 20px 0;
    }

    .click-area:active {
      transform: scale(0.95);
    }

    .click-skin-img {
      max-width: 70%;
      max-height: 70%;
      pointer-events: none;
    }

    /* Секція перемикачів скінів (Сітка по 2 в ряд) */
    .skins-section {
      width: 100%;
      background-color: rgba(22, 27, 34, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    .skins-title {
      font-size: 1rem;
      margin-bottom: 12px;
      text-align: center;
      font-weight: bold;
    }

    /* Фікс: сітка по 2 кнопки/тумблери в ряд з можливістю скролу */
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .skin-card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .skin-card span {
      font-size: 0.8rem;
      text-align: center;
    }

    .toggle-btn {
      background-color: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      width: 100%;
      transition: background 0.2s;
    }

    .toggle-btn.active {
      background-color: var(--accent-orange);
      color: #fff;
      border-color: var(--accent-orange);
    }
  </style>
</head>
<body>

  <!-- Верхня панель (Header) -->
  <div class="header">
    <div class="balance-display" id="balanceDisplay">$0.00</div>
    
    <div class="profile-container">
      <div class="profile-btn" onclick="toggleDropdown()">
        <!-- Аватар профілю -->
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Profile" id="profileAvatar">
      </div>

      <!-- Меню GitHub -->
      <div class="github-dropdown" id="githubDropdown">
        <div class="dropdown-header">
          Увійшов як <span id="userNickname">User_Dev</span>
        </div>
        <div class="dropdown-item" onclick="openModal('settingsModal')">
          ⚙️ Налаштування
        </div>
        <div class="dropdown-item" onclick="openModal('privacyModal')">
          📜 Приватна політика
        </div>
      </div>
    </div>
  </div>

  <!-- Ігровий контейнер -->
  <div class="game-container">
    <div class="click-area" onclick="handleTap(event)">
      <div id="currentSkinDisplay" style="font-size: 3rem;">🍊</div>
    </div>

    <!-- Вибір скінів (Сітка 2 в ряд) -->
    <div class="skins-section">
      <div class="skins-title" id="skinsTitleText">Вибір скінів</div>
      <div class="skins-grid" id="skinsGrid">
        <!-- Скіни генеруються автоматично скриптом без зміни логіки -->
      </div>
    </div>
  </div>

  <!-- Модальне вікно: Налаштування -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3 id="settingsTitle">Налаштування</h3>
      <label for="langSelect" id="langLabel">Мова / Language:</label>
      <select id="langSelect" onchange="changeLanguage(this.value)" style="width: 100%; padding: 8px; margin-top: 8px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px;">
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
        <option value="kk">Қазақша</option>
      </select>
      <button class="close-btn" onclick="closeModal('settingsModal')">Закрити</button>
    </div>
  </div>

  <!-- Модальне вікно: Приватна політика -->
  <div class="modal" id="privacyModal">
    <div class="modal-content">
      <h3 id="privacyTitle">Приватна політика</h3>
      <p id="privacyText" style="font-size: 0.85rem; line-height: 1.4;">
        У разі нападу нігерів на нігерію ви підете на війну.
      </p>
      <button class="close-btn" onclick="closeModal('privacyModal')">Зрозуміло</button>
    </div>
  </div>

  <script>
    // Основні змінні
    let balance = 0.00;
    const tapReward = 0.01; // 1 тап = 1 цент ($0.01)

    // Список скінів (збережено та розширено без зміни механіки)
    const skins = [
      { id: 1, name: 'Citro Drop', icon: '🍊' },
      { id: 2, name: 'Classic Coin', icon: '🪙' },
      { id: 3, name: 'Diamond Drop', icon: '💎' },
      { id: 4, name: 'Fire Energy', icon: '🔥' },
      { id: 5, name: 'Star Power', icon: '⭐' },
      { id: 6, name: 'Rocket Boost', icon: '🚀' }
    ];

    let activeSkinId = 1;

    // Ініціалізація
    function initSkins() {
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';
      
      skins.forEach(skin => {
        const card = document.createElement('div');
        card.className = 'skin-card';
        card.innerHTML = `
          <span>${skin.icon} ${skin.name}</span>
          <button class="toggle-btn ${skin.id === activeSkinId ? 'active' : ''}" onclick="selectSkin(${skin.id})">
            ${skin.id === activeSkinId ? 'Увімкнено' : 'Увімкнути'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function selectSkin(id) {
      activeSkinId = id;
      const selected = skins.find(s => s.id === id);
      document.getElementById('currentSkinDisplay').innerText = selected.icon;
      initSkins();
    }

    // Механіка тапу
    function handleTap(e) {
      balance += tapReward;
      document.getElementById('balanceDisplay').innerText = `$${balance.toFixed(2)}`;
    }

    // Меню профілю та модалки
    function toggleDropdown() {
      const dropdown = document.getElementById('githubDropdown');
      dropdown.classList.toggle('active');
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
      document.getElementById('githubDropdown').classList.remove('active');
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Закриття випадаючого меню при кліку поза ним
    window.onclick = function(event) {
      if (!event.target.closest('.profile-container')) {
        const dropdown = document.getElementById('githubDropdown');
        if (dropdown && dropdown.classList.contains('active')) {
          dropdown.classList.remove('active');
        }
      }
    }

    // Переклад мов
    const translations = {
      uk: {
        skinsTitle: "Вибір скінів",
        settings: "Налаштування",
        privacy: "Приватна політика",
        langLabel: "Мова / Language:"
      },
      ru: {
        skinsTitle: "Выбор скинов",
        settings: "Настройки",
        privacy: "Политика конфиденциальности",
        langLabel: "Язык / Language:"
      },
      kk: {
        skinsTitle: "Скиндерді таңдау",
        settings: "Баптаулар",
        privacy: "Купиялылық саясаты",
        langLabel: "Тіл / Language:"
      }
    };

    function changeLanguage(lang) {
      const t = translations[lang] || translations.uk;
      document.getElementById('skinsTitleText').innerText = t.skinsTitle;
      document.getElementById('settingsTitle').innerText = t.settings;
      document.getElementById('privacyTitle').innerText = t.privacy;
      document.getElementById('langLabel').innerText = t.langLabel;
    }

    // Запуск
    initSkins();
  </script>
</body>
</html>
