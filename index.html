<!-- CSS СТИЛІ (вставити в блок <style> вашого проекту) -->
<style>
  /* Верхня панель профілю Telegram */
  .top-bar-profile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    position: relative;
    font-family: inherit;
  }

  .user-profile-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #30363d;
    overflow: hidden;
    cursor: pointer;
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .user-profile-btn img, .user-profile-btn svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Випадаюче меню профілю */
  .profile-dropdown-menu {
    display: none;
    position: absolute;
    right: 15px;
    top: 55px;
    width: 230px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 1000;
  }

  .profile-dropdown-menu.active {
    display: block;
  }

  .dropdown-user-header {
    padding: 10px 12px;
    border-bottom: 1px solid #30363d;
    font-size: 13px;
    color: #8b949e;
  }

  .dropdown-user-header strong {
    display: block;
    color: #f0f6fc;
    font-size: 14px;
    margin-top: 2px;
  }

  .dropdown-menu-item {
    padding: 10px 12px;
    font-size: 13px;
    color: #c9d1d9;
    cursor: pointer;
    border-bottom: 1px solid #30363d;
  }

  .dropdown-menu-item:last-child {
    border-bottom: none;
  }

  .dropdown-menu-item:hover {
    background: #1f242c;
  }

  /* Контейнер клікера */
  .tap-module-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    gap: 20px;
  }

  /* Зона тапу з оранжевим візерунком */
  .tap-click-area {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background-color: #000000;
    background-image: radial-gradient(#ff5500 18%, transparent 19%);
    background-size: 20px 20px;
    border: 4px solid #ff5500;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 85, 0, 0.4);
    transition: transform 0.05s ease;
  }

  .tap-click-area:active {
    transform: scale(0.95);
  }

  /* Фіксована сітка для тумблерів/кнопок скінів: рівно 2 в ряд */
  .skins-grid-container {
    width: 100%;
    max-width: 400px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    box-sizing: border-box;
  }

  .skins-grid-title {
    font-size: 14px;
    font-weight: bold;
    color: #f0f6fc;
    margin-bottom: 10px;
  }

  .skins-toggle-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 елементи в ряд */
    gap: 10px;
    max-height: 220px;
    overflow-y: auto; /* Скрол при додаванні нових скінів */
    padding-right: 4px;
  }

  .skins-toggle-grid::-webkit-scrollbar {
    width: 4px;
  }
  .skins-grid-container::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 4px;
  }

  .skin-toggle-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .skin-toggle-btn {
    width: 100%;
    padding: 6px 0;
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }

  .skin-toggle-btn.active {
    background: #ff5500;
    color: #ffffff;
    border-color: #ff5500;
  }

  /* Модалки */
  .app-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .app-modal-body {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    width: 85%;
    max-width: 320px;
    padding: 18px;
    color: #c9d1d9;
  }
</style>


<!-- HTML ШАБЛОН МОДУЛЯ (вставити у відповідну вкладку/блок) -->

<!-- Шапка з профілем Telegram -->
<div class="top-bar-profile">
  <div>
    <span style="font-size: 11px; color: #8b949e; display: block;">Баланс</span>
    <strong id="tapBalanceDisplay" style="color: #3fb950; font-size: 16px;">$0.00</strong>
  </div>

  <div style="position: relative;">
    <div class="user-profile-btn" onclick="toggleTapProfileMenu()">
      <img id="tgUserAvatarImg" src="" alt="" style="display: none;">
      <svg id="tgUserAvatarPlaceholder" viewBox="0 0 24 24" fill="#8b949e">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <div class="profile-dropdown-menu" id="tapProfileDropdown">
      <div class="dropdown-user-header">
        Користувач:
        <strong id="tgUsernameText">Завантаження...</strong>
      </div>
      <div class="dropdown-menu-item" onclick="openTapModal('tapSettingsModal')">
        Налаштування
      </div>
      <div class="dropdown-menu-item" onclick="openTapModal('tapPrivacyModal')">
        Приватна політика
      </div>
    </div>
  </div>
</div>

<!-- Модуль Тапу -->
<div class="tap-module-container">
  <div class="tap-click-area" onclick="registerTapClick(event)">
    <div id="activeSkinContainer">
      <!-- Сюди відображається обраний скін -->
    </div>
  </div>

  <!-- Сітка скінів -->
  <div class="skins-grid-container">
    <div class="skins-grid-title" id="txtSkinsHeader">Управління скінами</div>
    <div class="skins-toggle-grid" id="skinsToggleGrid">
      <!-- Генерується JS без зміни назв ваших скінів -->
    </div>
  </div>
</div>

<!-- Модальне вікно Налаштувань -->
<div class="app-modal-overlay" id="tapSettingsModal">
  <div class="app-modal-body">
    <h3 style="margin-top: 0;" id="txtSettingsTitle">Налаштування</h3>
    <label for="appLangSelect" id="txtLangLabel" style="font-size: 12px;">Мова інтерфейсу:</label>
    <select id="appLangSelect" onchange="applyAppLanguage(this.value)" style="width: 100%; margin-top: 8px; padding: 8px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px;">
      <option value="uk">Українська</option>
      <option value="ru">Русский</option>
      <option value="kk">Қазақша</option>
    </select>
    <button onclick="closeTapModal('tapSettingsModal')" style="margin-top: 15px; width: 100%; padding: 8px; background: #ff5500; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Закрити</button>
  </div>
</div>

<!-- Модальне вікно Політики -->
<div class="app-modal-overlay" id="tapPrivacyModal">
  <div class="app-modal-body">
    <h3 style="margin-top: 0;" id="txtPrivacyTitle">Приватна політика</h3>
    <p style="font-size: 12px; line-height: 1.4;">
      У разі нападу нігерів на нігерію ви підете на війну.
    </p>
    <button onclick="closeTapModal('tapPrivacyModal')" style="margin-top: 15px; width: 100%; padding: 8px; background: #ff5500; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Зрозуміло</button>
  </div>
</div>


<!-- JAVASCRIPT ЛОГІКА МОДУЛЯ -->
<script>
  // 1. Отримання аватара та нікнейму Telegram
  (function initTelegramProfile() {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const user = tg?.initDataUnsafe?.user;
    const nameElem = document.getElementById('tgUsernameText');
    const avatarImg = document.getElementById('tgUserAvatarImg');
    const avatarSvg = document.getElementById('tgUserAvatarPlaceholder');

    if (user) {
      const displayName = user.username ? `@${user.username}` : `${user.first_name || ''} ${user.last_name || ''}`.trim();
      nameElem.innerText = displayName || "Telegram User";

      if (user.photo_url) {
        avatarImg.src = user.photo_url;
        avatarImg.style.display = 'block';
        avatarSvg.style.display = 'none';
      }
    } else {
      nameElem.innerText = "Local_User";
    }
  })();

  // 2. Механіка Тапу (1 клік = 0.01$)
  let currentTapBalance = 0.00;
  function registerTapClick(e) {
    currentTapBalance += 0.01;
    document.getElementById('tapBalanceDisplay').innerText = `$${currentTapBalance.toFixed(2)}`;
  }

  // 3. Рендер сітки скінів (по 2 в ряд)
  // Вставте сюди масив вашого оригінального списку скінів
  const myAppSkins = [
    { id: 1, name: "Skin #1" },
    { id: 2, name: "Skin #2" },
    { id: 3, name: "Skin #3" },
    { id: 4, name: "Skin #4" }
  ];
  let selectedSkinId = 1;

  function renderSkinsGrid() {
    const grid = document.getElementById('skinsToggleGrid');
    if (!grid) return;
    grid.innerHTML = '';

    myAppSkins.forEach(skin => {
      const active = skin.id === selectedSkinId;
      const card = document.createElement('div');
      card.className = 'skin-toggle-card';
      card.innerHTML = `
        <span style="font-size: 12px; color: #c9d1d9;">${skin.name}</span>
        <button class="skin-toggle-btn ${active ? 'active' : ''}" onclick="switchSkin(${skin.id})">
          ${active ? 'Обрано' : 'Увімкнути'}
        </button>
      `;
      grid.appendChild(card);
    });
  }

  function switchSkin(id) {
    selectedSkinId = id;
    renderSkinsGrid();
  }

  // 4. Управління модальними вікнами та меню
  function toggleTapProfileMenu() {
    document.getElementById('tapProfileDropdown').classList.toggle('active');
  }

  function openTapModal(id) {
    document.getElementById(id).style.display = 'flex';
    document.getElementById('tapProfileDropdown').classList.remove('active');
  }

  function closeTapModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  // Переклад мов
  const langDict = {
    uk: { header: "Управління скінами", settings: "Налаштування", privacy: "Приватна політика", lang: "Мова інтерфейсу:" },
    ru: { header: "Управление скинами", settings: "Настройки", privacy: "Политика конфиденциальности", lang: "Язык интерфейса:" },
    kk: { header: "Скиндерді басқару", settings: "Баптаулар", privacy: "Құпиялылық саясаты", lang: "Интерфейс тілі:" }
  };

  function applyAppLanguage(lang) {
    const data = langDict[lang] || langDict.uk;
    document.getElementById('txtSkinsHeader').innerText = data.header;
    document.getElementById('txtSettingsTitle').innerText = data.settings;
    document.getElementById('txtPrivacyTitle').innerText = data.privacy;
    document.getElementById('txtLangLabel').innerText = data.lang;
  }

  // Запуск при ініціалізації
  renderSkinsGrid();
</script>
