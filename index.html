<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Tester Mini App</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #08080d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    @keyframes tigerPulse {
      0% { box-shadow: 0 0 10px #facc15; border-color: #facc15; }
      50% { box-shadow: 0 0 25px #f59e0b; border-color: #f59e0b; transform: scale(1.01); }
      100% { box-shadow: 0 0 10px #facc15; border-color: #facc15; }
    }

    @keyframes badGlitch {
      0% { transform: translate(0, 0); box-shadow: 0 0 10px #ef4444; }
      25% { transform: translate(-3px, 3px); box-shadow: 0 0 20px #ef4444; }
      50% { transform: translate(3px, -3px); border-color: #dc2626; }
      75% { transform: translate(-3px, -2px); }
      100% { transform: translate(0, 0); box-shadow: 0 0 10px #ef4444; }
    }

    @keyframes maxPulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px #4ade80; border-color: #4ade80; }
      50% { transform: scale(1.03); box-shadow: 0 0 40px #38edf8, 0 0 20px #c084fc; border-color: #38edf8; }
      100% { transform: scale(1); box-shadow: 0 0 20px #4ade80; border-color: #4ade80; }
    }

    @keyframes flashOverlay {
      0% { opacity: 0.85; background: #fff; }
      100% { opacity: 0; background: transparent; }
    }

    .tiger-aura-active {
      animation: tigerPulse 0.8s infinite alternate ease-in-out !important;
    }

    .bad-aura-active {
      animation: badGlitch 0.15s infinite ease-in-out !important;
    }

    .max-aura-active {
      animation: maxPulseGlow 0.6s infinite alternate ease-in-out !important;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      z-index: 99;
      top: -10px;
      animation: fall 2s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(380px) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div id="flash-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:90;"></div>

<div id="aura-widget-container" style="position: relative; overflow: hidden; font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f0f17; color: #fff; padding: 20px; border-radius: 20px; max-width: 420px; margin: 0 auto; box-shadow: 0 0 25px rgba(168, 85, 247, 0.3); border: 2px solid #2e1065; transition: all 0.2s ease;">
  
  <h2 style="color: #c084fc; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px;">✨ Aura tester ✨</h2>
  <p style="font-size: 12px; color: #a7f3d0; margin-bottom: 15px;">Дізнайся свою ауру або перевір її!</p>

  <!-- Перемикачі -->
  <div style="display: flex; gap: 6px; justify-content: center; margin-bottom: 15px;">
    <button onclick="switchTab('dob')" id="btn-dob" style="flex:1; padding: 8px 4px; border: none; border-radius: 8px; background: #9333ea; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;">🎂 По ДН</button>
    <button onclick="switchTab('name')" id="btn-name" style="flex:1; padding: 8px 4px; border: none; border-radius: 8px; background: #1e1b4b; color: #a78bfa; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;">🏷️ По імені</button>
    <button onclick="switchTab('other')" id="btn-other" style="flex:1; padding: 8px 4px; border: none; border-radius: 8px; background: #1e1b4b; color: #a78bfa; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;">🔮 Інша аура</button>
  </div>

  <!-- Поля вводу -->
  <div id="tab-dob">
    <input type="date" id="input-dob" style="width: 80%; padding: 10px; border-radius: 8px; border: 1px solid #6b21a8; background: #1e1b4b; color: #fff; text-align: center; font-size: 14px; outline: none;">
  </div>

  <div id="tab-name" style="display: none;">
    <input type="text" id="input-name" placeholder="Введи своє ім'я або ім'я друга..." style="width: 80%; padding: 10px; border-radius: 8px; border: 1px solid #6b21a8; background: #1e1b4b; color: #fff; text-align: center; font-size: 14px; outline: none;">
  </div>

  <div id="tab-other" style="display: none;">
    <input type="text" id="input-other" placeholder="Введи будь-що (слово, предмет,і т.д.)..." style="width: 80%; padding: 10px; border-radius: 8px; border: 1px solid #6b21a8; background: #1e1b4b; color: #fff; text-align: center; font-size: 14px; outline: none;">
  </div>

  <br>
  <button id="calc-btn" onclick="checkAura()" style="background: linear-gradient(90deg, #c084fc, #38edf8); color: #000; border: none; padding: 12px 25px; font-weight: 900; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase;">
    Дізнатися ауру 🚀
  </button>

  <!-- Блок результату -->
  <div id="result-box" style="margin-top: 20px; display: none; background: #160a2a; padding: 15px; border-radius: 12px; border: 2px solid #581c87; transition: all 0.2s ease;">
    <div id="aura-title" style="font-size: 18px; font-weight: bold; margin-bottom: 8px;"></div>
    
    <div id="meme-container" style="margin: 5px auto; min-height: 45px;">
      <div id="meme-emoji" style="font-size: 46px;"></div>
    </div>

    <div id="aura-points" style="font-size: 28px; font-weight: 900; margin: 10px 0; letter-spacing: 0.5px;"></div>

    <p id="aura-desc" style="font-size: 13px; color: #e9d5ff; line-height: 1.4; margin: 0;"></p>
  </div>

</div>

<!-- Phonk Audio -->
<audio id="phonk-audio" crossorigin="anonymous" src="https://ia801503.us.archive.org/15/items/phonk-yara-yara/phonk-yara-yara.mp3" preload="auto"></audio>

<script>
// Ініціалізація Telegram Mini App
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

let activeTab = 'dob';
let isProcessing = false;
let audioCtx = null;

// Список із 10 рівнів аури
const auraTiers = [
  {
    maxScore: 0,
    title: '💀 -аура / sub 3',
    color: '#ef4444',
    desc: 'лох, навіть у живчика більше аури ніж у тебе!',
    emoji: '🤡🗿',
    animClass: 'bad-aura-active',
    effect: 'badSound'
  },
  {
    maxScore: 100000,
    title: '📉 Bot',
    color: '#f97316',
    desc: 'Нульова аура, ти ,бот.',
    emoji: '🤖📦',
    animClass: '',
    effect: null
  },
  {
    maxScore: 220000,
    title: '⚡ default aura ',
    color: '#fbbf24',
    desc: 'звичайна дефолтна аура',
    emoji: '🙂⚡',
    animClass: '',
    effect: null
  },
  {
    maxScore: 350000,
    title: '🤙 normal ',
    color: '#facc15',
    desc: 'ну чиста аура.',
    emoji: '😎🔥',
    animClass: 'tiger-aura-active',
    effect: null
  },
  {
    maxScore: 500000,
    title: '🔥 Заряджений тип',
    color: '#ff5722',
    desc: 'Твоя аура вже починає підпалювати оточуючих!',
    emoji: '👺💥',
    animClass: 'tiger-aura-active',
    effect: null
  },
  {
    maxScore: 650000,
    title: '💎 Briliant aura',
    color: '#06b6d4',
    desc: 'Чистий Aura farming',
    emoji: '💎🕶️',
    animClass: 'max-aura-active',
    effect: null
  },
  {
    maxScore: 780000,
    title: '🔮 mega aura',
    color: '#a855f7',
    desc: 'Твоя аура потуууужна!',
    emoji: '🗿👑',
    animClass: 'max-aura-active',
    effect: 'confetti'
  },
  {
    maxScore: 880000,
    title: '🪐 Галактичний бос',
    color: '#3b82f6',
    desc: 'Рівень аури пробиває атмосферу планети!',
    emoji: '🌌⚡',
    animClass: 'max-aura-active',
    effect: 'confetti'
  },
  {
    maxScore: 960000,
    title: '👑 True adam',
    color: '#4ade80',
    desc: '100% аура ',
    emoji: '🤴🤑💰',
    animClass: 'max-aura-active',
    effect: 'phonk'
  },
  {
    maxScore: Infinity,
    title: '✨ gigachad',
    color: '#38edf8',
    desc: 'Нереальний зашкал аури!',
    emoji: '👑⚡🪐',
    animClass: 'max-aura-active',
    effect: 'phonk'
  }
];

function getAuraScoreFromInput(str) {
  let hash = 0;
  const cleanStr = str.trim().toLowerCase();
  for (let i = 0; i < cleanStr.length; i++) {
    hash = ((hash << 5) - hash) + cleanStr.charCodeAt(i);
    hash |= 0;
  }
  
  const min = -10000;
  const max = 1000000;
  const normalized = Math.abs(hash) % (max - min + 1);
  return min + normalized;
}

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTickSound() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(450 + Math.random() * 200, ctx.currentTime);
    gain.gain.setValueAtTime(0.015, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.03);
  } catch(e) {}
}

function playBadSound() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function spawnConfetti() {
  const container = document.getElementById('aura-widget-container');
  const colors = ['#4ade80', '#38edf8', '#c084fc', '#facc15', '#ff007f'];
  for (let i = 0; i < 35; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    container.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2500);
  }
}

function triggerFlash() {
  const flash = document.getElementById('flash-overlay');
  flash.style.animation = 'none';
  flash.offsetHeight;
  flash.style.animation = 'flashOverlay 0.4s ease-out';
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-dob').style.display = tab === 'dob' ? 'block' : 'none';
  document.getElementById('tab-name').style.display = tab === 'name' ? 'block' : 'none';
  document.getElementById('tab-other').style.display = tab === 'other' ? 'block' : 'none';

  document.getElementById('btn-dob').style.background = tab === 'dob' ? '#9333ea' : '#1e1b4b';
  document.getElementById('btn-dob').style.color = tab === 'dob' ? '#fff' : '#a78bfa';
  
  document.getElementById('btn-name').style.background = tab === 'name' ? '#9333ea' : '#1e1b4b';
  document.getElementById('btn-name').style.color = tab === 'name' ? '#fff' : '#a78bfa';

  document.getElementById('btn-other').style.background = tab === 'other' ? '#9333ea' : '#1e1b4b';
  document.getElementById('btn-other').style.color = tab === 'other' ? '#fff' : '#a78bfa';
}

function checkAura() {
  if (isProcessing) return;
  getAudioContext();

  let val = '';
  if (activeTab === 'dob') val = document.getElementById('input-dob').value;
  if (activeTab === 'name') val = document.getElementById('input-name').value.trim();
  if (activeTab === 'other') val = document.getElementById('input-other').value.trim();

  if (!val) {
    alert('Заповни поле!');
    return;
  }

  const phonkTrack = document.getElementById('phonk-audio');
  if (phonkTrack) {
    phonkTrack.pause();
    phonkTrack.currentTime = 0;
  }

  isProcessing = true;
  const btn = document.getElementById('calc-btn');
  btn.style.opacity = '0.6';
  btn.innerText = 'Нараховуємо... 💰';

  const targetScore = getAuraScoreFromInput(val);

  const tier = auraTiers.find(t => targetScore <= t.maxScore) || auraTiers[auraTiers.length - 1];

  const resultBox = document.getElementById('result-box');
  const pointsEl = document.getElementById('aura-points');
  const titleEl = document.getElementById('aura-title');
  const descEl = document.getElementById('aura-desc');
  const emojiEl = document.getElementById('meme-emoji');

  resultBox.style.display = 'block';
  resultBox.classList.remove('max-aura-active', 'tiger-aura-active', 'bad-aura-active');

  titleEl.style.color = tier.color;
  titleEl.innerText = tier.title;
  descEl.innerText = tier.desc;
  emojiEl.innerText = tier.emoji;
  pointsEl.style.color = tier.color;

  if (tier.animClass) {
    resultBox.classList.add(tier.animClass);
  }

  if (tier.effect === 'badSound') {
    playBadSound();
  } else if (tier.effect === 'confetti') {
    spawnConfetti();
  } else if (tier.effect === 'phonk') {
    triggerFlash();
    spawnConfetti();
    if (phonkTrack) {
      phonkTrack.currentTime = 20;
      phonkTrack.volume = 0.95;
      phonkTrack.play().catch(e => console.log(e));
    }
  }

  const duration = 2200; 
  const startTime = performance.now();

  function animateInGameMoney(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    
    const easeProgress = 1 - Math.pow(1 - progress, 2.5);
    const currentVal = Math.floor(easeProgress * targetScore);

    const prefix = targetScore >= 0 ? '+' : '';
    pointsEl.innerText = `${prefix}${currentVal.toLocaleString()} AURA`;
    
    playTickSound();

    if (progress < 1) {
      requestAnimationFrame(animateInGameMoney);
    } else {
      isProcessing = false;
      btn.style.opacity = '1';
      btn.innerText = 'Дізнатися ауру 🚀';
      pointsEl.innerText = `${prefix}${targetScore.toLocaleString()} AURA`;
    }
  }

  requestAnimationFrame(animateInGameMoney);
}
</script>

</body>
</html>
