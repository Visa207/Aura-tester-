<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Clicker Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-orange: #ff5500;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Верхня панель у стилі GitHub */
    .header {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 100;
    }

    .balance-container {
      display: flex;
      flex-direction: column;
    }

    .balance-label {
      font-size: 0.75rem;
      color: #8b949e;
    }

    .balance-amount {
      font-size: 1.25rem;
      font-weight: bold;
      color: #3fb950;
    }

    .profile-container {
      position: relative;
    }

    .profile-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #21262d;
      border: 2px solid var(--border-color);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dropdown GitHub Style */
    .github-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 48px;
      width: 240px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 101;
    }

    .github-dropdown.active {
      display: block;
    }

    .dropdown-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: #8b949e;
    }

    .dropdown-header #userNickname {
      display: block;
      font-weight: bold;
      color: #f0f6fc;
      font-size: 0.95rem;
      margin-top: 2px;
    }

    .dropdown-item {
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--text-color);
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background-color: #1f242c;
    }

    /* Основна зона гри */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      gap: 20px;
    }

    /* Клікер з фоном Citro Drop */
    .clicker-box {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      /* Чорний фон з помаранчевими крапками */
      background-color: #000000;
      background-image: radial-gradient(var(--accent-orange) 18%, transparent 19%);
      background-size: 20px 20px;
      border: 4px solid var(--accent-orange);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 85, 0, 0.35);
      transition: transform 0.08s ease;
      position: relative;
    }

    .clicker-box:active {
      transform: scale(0.94);
    }

    .clicker-skin-icon {
      font-size: 4.5rem;
      pointer-events: none;
    }

    /* Секція скінів: сітка по 2 кнопки в ряд */
    .skins-container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
    }

    .skins-header {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #f0f6fc;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Ровно 2 кнопки в ряд */
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Стилізація скролбару */
    .skins-grid::-webkit-scrollbar {
      width: 4px;
    }
    .skins-grid::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .skin-card {
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .skin-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .skin-btn {
      width: 100%;
      padding: 6px 0;
      background-color: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .skin-btn.active {
      background-color: var(--accent-orange);
      color: #ffffff;
      border-color: var(--accent-orange);
    }

    /* Модальні вікна */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 340px;
      padding: 20px;
    }

    .modal-title {
      margin-top: 0;
      font-size: 1.1rem;
      color: #f0f6fc;
    }

    .modal-close-btn {
      margin-top: 15px;
      width: 100%;
      padding: 8px;
      background-color: var(--accent-orange);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Верхня панель -->
  <div class="header">
    <div class="balance-container">
      <span class="balance-label">Баланс</span>
      <span class="balance-amount" id="balanceDisplay">$0.00</span>
    </div>

    <div class="profile-container">
      <div class="profile-btn" onclick="toggleProfileDropdown()">
        <img id="userAvatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Profile">
      </div>

      <div class="github-dropdown" id="githubDropdown">
        <div class="dropdown-header">
          Увійшов як:
          <span id="userNickname">Завантаження...</span>
        </div>
        <div class="dropdown-item" onclick="openModal('settingsModal')">
          ⚙️ <span id="menuSettingsLabel">Налаштування</span>
        </div>
        <div class="dropdown-item" onclick="openModal('privacyModal')">
          📜 <span id="menuPrivacyLabel">Приватна політика</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Ігрова зона -->
  <div class="main-content">
    <div class="clicker-box" onclick="handleTap(event)">
      <div class="clicker-skin-icon" id="activeSkinIcon">🍊</div>
    </div>

    <!-- Вибір скінів: по 2 кнопки в ряд -->
    <div class="skins-container">
      <div class="skins-header" id="skinsTitleText">Скіни</div>
      <div class="skins-grid" id="skinsGrid">
        <!-- Генерується через JS -->
      </div>
    </div>
  </div>

  <!-- Модальне вікно: Налаштування -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h3 class="modal-title" id="settingsTitle">Налаштування</h3>
      <label for="langSelect" id="langLabel" style="font-size: 0.85rem;">Мова інтерфейсу:</label>
      <select id="langSelect" onchange="changeLanguage(this.value)" style="width: 100%; margin-top: 8px; padding: 8px; background: #0d1117; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
        <option value="kk">Қазақша</option>
      </select>
      <button class="modal-close-btn" onclick="closeModal('settingsModal')">Закрити</button>
    </div>
  </div>

  <!-- Модальне вікно: Приватна політика -->
  <div class="modal-overlay" id="privacyModal">
    <div class="modal-box">
      <h3 class="modal-title" id="privacyTitle">Приватна політика</h3>
      <p id="privacyText" style="font-size: 0.85rem; line-height: 1.4; color: var(--text-color);">
        У разі нападу нігерів на нігерію ви підете на війну.
      </p>
      <button class="modal-close-btn" onclick="closeModal('privacyModal')">Зрозуміло</button>
    </div>
  </div>

  <script>
    // Ініціалізація Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Отримання даних користувача з Telegram
    function loadTelegramUserData() {
      const nicknameElem = document.getElementById('userNickname');
      const avatarElem = document.getElementById('userAvatar');

      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        const name = user.username ? `@${user.username}` : `${user.first_name || ''} ${user.last_name || ''}`.trim();
        nicknameElem.innerText = name || "Telegram User";

        if (user.photo_url) {
          avatarElem.src = user.photo_url;
        }
      } else {
        // Альтернативний варіант (якщо відкрито просто в браузері)
        nicknameElem.innerText = "Browser_User";
      }
    }

    // Стан балансу та скінів
    let balance = 0.00;
    const tapReward = 0.01; // 1 клік = 1 цент ($0.01)

    const skins = [
      { id: 1, name: 'Citro Drop', icon: '🍊' },
      { id: 2, name: 'Classic Coin', icon: '🪙' },
      { id: 3, name: 'Diamond', icon: '💎' },
      { id: 4, name: 'Fire Energy', icon: '🔥' },
      { id: 5, name: 'Star Power', icon: '⭐' },
      { id: 6, name: 'Rocket Boost', icon: '🚀' }
    ];

    let activeSkinId = 1;

    // Рендер сітки скінів (по 2 кнопки в ряд)
    function renderSkins() {
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';

      skins.forEach(skin => {
        const isSelected = skin.id === activeSkinId;
        const card = document.createElement('div');
        card.className = 'skin-card';
        card.innerHTML = `
          <div class="skin-info">
            <span>${skin.icon}</span>
            <span>${skin.name}</span>
          </div>
          <button class="skin-btn ${isSelected ? 'active' : ''}" onclick="selectSkin(${skin.id})">
            ${isSelected ? 'Обрано' : 'Обрати'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function selectSkin(id) {
      activeSkinId = id;
      const skin = skins.find(s => s.id === id);
      if (skin) {
        document.getElementById('activeSkinIcon').innerText = skin.icon;
      }
      renderSkins();
    }

    // Клік
    function handleTap(event) {
      balance += tapReward;
      document.getElementById('balanceDisplay').innerText = `$${balance.toFixed(2)}`;
    }

    // Меню профілю та випадаючий список
    function toggleProfileDropdown() {
      document.getElementById('githubDropdown').classList.toggle('active');
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
      document.getElementById('githubDropdown').classList.remove('active');
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Закриття Dropdown при кліку поза ним
    document.addEventListener('click', (e) => {
      const profile = document.querySelector('.profile-container');
      if (profile && !profile.contains(e.target)) {
        document.getElementById('githubDropdown').classList.remove('active');
      }
    });

    // Локалізація
    const translations = {
      uk: {
        skinsTitle: "Скіни",
        settings: "Налаштування",
        privacy: "Приватна політика",
        langLabel: "Мова інтерфейсу:",
        menuSettings: "Налаштування",
        menuPrivacy: "Приватна політика"
      },
      ru: {
        skinsTitle: "Скины",
        settings: "Настройки",
        privacy: "Политика конфиденциальности",
        langLabel: "Язык интерфейса:",
        menuSettings: "Настройки",
        menuPrivacy: "Политика конфиденциальности"
      },
      kk: {
        skinsTitle: "Скиндер",
        settings: "Баптаулар",
        privacy: "Құпиялылық саясаты",
        langLabel: "Интерфейс тілі:",
        menuSettings: "Баптаулар",
        menuPrivacy: "Құпиялылық саясаты"
      }
    };

    function changeLanguage(lang) {
      const t = translations[lang] || translations.uk;
      document.getElementById('skinsTitleText').innerText = t.skinsTitle;
      document.getElementById('settingsTitle').innerText = t.settings;
      document.getElementById('privacyTitle').innerText = t.privacy;
      document.getElementById('langLabel').innerText = t.langLabel;
      document.getElementById('menuSettingsLabel').innerText = t.menuSettings;
      document.getElementById('menuPrivacyLabel').innerText = t.menuPrivacy;
    }

    // Запуск при завантаженні
    loadTelegramUserData();
    renderSkins();
  </script>
</body>
</html>
