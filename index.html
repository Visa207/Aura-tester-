<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Верхня панель (GitHub Style Header) */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      position: relative;
      z-index: 10;
    }

    .balance-display {
      font-size: 18px;
      font-weight: bold;
      color: #3fb950;
    }

    .profile-container {
      position: relative;
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #30363d;
      cursor: pointer;
      background-color: #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #58a6ff;
    }

    /* Випадаюче меню GitHub */
    .github-dropdown {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      width: 220px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      padding: 8px 0;
    }

    .github-dropdown.active {
      display: block;
    }

    .dropdown-header {
      padding: 8px 16px;
      border-bottom: 1px solid #30363d;
      font-size: 13px;
      color: #8b949e;
    }

    .dropdown-header span {
      display: block;
      font-weight: bold;
      color: #c9d1d9;
      font-size: 14px;
    }

    .dropdown-item {
      padding: 8px 16px;
      font-size: 14px;
      color: #c9d1d9;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item:hover {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .dropdown-divider {
      height: 1px;
      background-color: #30363d;
      margin: 4px 0;
    }

    /* Зона клікера з помаранчевим фоном у цятку (Nitro Drop style) */
    .clicker-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #000000;
      /* Генерація симетричного візерунку у помаранчеву цятку */
      background-image: radial-gradient(#ff4500 20%, transparent 20%), radial-gradient(#ff4500 20%, transparent 20%);
      background-position: 0 0, 15px 15px;
      background-size: 30px 30px;
    }

    .click-target {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff5722, #e64a19);
      border: 4px solid #ffffff;
      box-shadow: 0 0 20px rgba(255, 87, 34, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.05s ease;
      touch-action: manipulation;
    }

    .click-target:active {
      transform: scale(0.93);
    }

    /* Анімація вилітаючих цифр */
    .floating-text {
      position: absolute;
      color: #2ecc71;
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px);
      }
    }

    /* Список скінів / Магазин (З виправленням стискання тумблерів) */
    .shop-container {
      background-color: #161b22;
      border-top: 1px solid #30363d;
      padding: 12px;
      max-height: 220px;
      overflow-y: auto;
    }

    .shop-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #8b949e;
    }

    .skins-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Фікс: flex-shrink: 0 запобігає звуженню елементів при збільшенні їх кількості */
    .skin-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #21262d;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      flex-shrink: 0;
    }

    .skin-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skin-preview {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    /* Перемикач (Тумблер) */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
      flex-shrink: 0; /* Фікс: тумблер не зменшується */
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #238636;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Модальні вікна (Налаштування та Політика) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      padding: 16px;
      position: relative;
    }

    .modal-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #c9d1d9;
    }

    .modal-body {
      font-size: 14px;
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .close-btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }

    .lang-select {
      width: 100%;
      padding: 8px;
      background-color: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Верхня панель у стилі GitHub -->
  <div class="header">
    <div class="balance-display" id="balance">$0.00</div>
    <div class="profile-container">
      <div class="profile-avatar" onclick="toggleDropdown()">GH</div>
      
      <!-- Випадаюче меню -->
      <div class="github-dropdown" id="githubDropdown">
        <div class="dropdown-header">
          Увійшли як: <span id="userNickname">Developer</span>
        </div>
        <div class="dropdown-item" onclick="openModal('settingsModal')">⚙️ Налаштування</div>
        <div class="dropdown-item" onclick="openModal('privacyModal')">📜 Приватна політика</div>
      </div>
    </div>
  </div>

  <!-- Ігрова зона клікера -->
  <div class="clicker-area" id="clickArea">
    <div class="click-target" id="clickBtn">КЛІК</div>
  </div>

  <!-- Список скінів (з виправленими тумблерами) -->
  <div class="shop-container">
    <div class="shop-title">Скіни та Стилі</div>
    <div class="skins-list">
      
      <div class="skin-card">
        <div class="skin-info">
          <div class="skin-preview" style="background: #ff5722;"></div>
          <span>Класичний Помаранчевий</span>
        </div>
        <label class="switch">
          <input type="radio" name="skin" checked onclick="applySkin('#ff5722')">
          <span class="slider"></span>
        </label>
      </div>

      <div class="skin-card">
        <div class="skin-info">
          <div class="skin-preview" style="background: #00bcd4;"></div>
          <span>Неоновий Блакитний</span>
        </div>
        <label class="switch">
          <input type="radio" name="skin" onclick="applySkin('#00bcd4')">
          <span class="slider"></span>
        </label>
      </div>

      <div class="skin-card">
        <div class="skin-info">
          <div class="skin-preview" style="background: #e91e63;"></div>
          <span>Кібер Рожевий</span>
        </div>
        <label class="switch">
          <input type="radio" name="skin" onclick="applySkin('#e91e63')">
          <span class="slider"></span>
        </label>
      </div>

    </div>
  </div>

  <!-- Модальне вікно: Налаштування -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">Налаштування</div>
      <div class="modal-body">
        <label for="lang">Оберіть мову інтерфейсу:</label>
        <select id="lang" class="lang-select">
          <option value="uk">Українська</option>
          <option value="ru">Русский</option>
          <option value="kk">Қазақша</option>
        </select>
      </div>
      <button class="close-btn" onclick="closeModal('settingsModal')">Закрити</button>
    </div>
  </div>

  <!-- Модальне вікно: Політика конфіденційності -->
  <div class="modal-overlay" id="privacyModal">
    <div class="modal-content">
      <div class="modal-header">Приватна політика</div>
      <div class="modal-body">
        У разі нападу нігерів на нігерію ви підете на війну.
      </div>
      <button class="close-btn" onclick="closeModal('privacyModal')">Згоден / Закрити</button>
    </div>
  </div>

  <script>
    let balance = 0.00;
    const clickValue = 0.01; // 1 клік = 1 цент

    const balanceEl = document.getElementById('balance');
    const clickBtn = document.getElementById('clickBtn');
    const clickArea = document.getElementById('clickArea');

    // Клік-механіка
    clickBtn.addEventListener('click', (e) => {
      balance += clickValue;
      balanceEl.textContent = `$${balance.toFixed(2)}`;

      // Виліт тексту +0.01$
      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.textContent = `+$${clickValue.toFixed(2)}`;
      
      const rect = clickArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      floatText.style.left = `${x}px`;
      floatText.style.top = `${y}px`;

      clickArea.appendChild(floatText);

      setTimeout(() => {
        floatText.remove();
      }, 800);
    });

    // Перемикання випадаючого меню GitHub
    function toggleDropdown() {
      const dropdown = document.getElementById('githubDropdown');
      dropdown.classList.toggle('active');
    }

    // Закриття меню при кліку поза ним
    window.addEventListener('click', (e) => {
      if (!e.target.closest('.profile-container')) {
        document.getElementById('githubDropdown').classList.remove('active');
      }
    });

    // Управління модальними вікнами
    function openModal(id) {
      document.getElementById(id).classList.add('active');
      document.getElementById('githubDropdown').classList.remove('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Зміна скіна кнопки
    function applySkin(color) {
      clickBtn.style.background = color;
      clickBtn.style.boxShadow = `0 0 20px ${color}`;
    }
  </script>
</body>
</html>
